services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: ${POSTGRES_USER:-dentistry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dentistry}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dentistry-lab2-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-appointments.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d catalog"]
      interval: 5s
      timeout: 3s
      retries: 10

  config-server:
    build:
      context: .
      args:
        MODULE: config-server
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dentistry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dentistry}
      CLINIC_ZONE_ID: ${CLINIC_ZONE_ID:-Europe/Moscow}
      APPOINTMENT_SLOT_MINUTES: ${APPOINTMENT_SLOT_MINUTES:-30}
    volumes:
      - ./config-repo:/config:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  eureka-server:
    build:
      context: .
      args:
        MODULE: eureka-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  catalog-service:
    build:
      context: .
      args:
        MODULE: catalog-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      POSTGRES_USER: ${POSTGRES_USER:-dentistry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dentistry}
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 30s

  appointment-service:
    build:
      context: .
      args:
        MODULE: appointment-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      POSTGRES_USER: ${POSTGRES_USER:-dentistry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dentistry}
      CLINIC_ZONE_ID: ${CLINIC_ZONE_ID:-Europe/Moscow}
      APPOINTMENT_SLOT_MINUTES: ${APPOINTMENT_SLOT_MINUTES:-30}
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 30s

  gateway:
    build:
      context: .
      args:
        MODULE: gateway
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      appointment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 25s

volumes:
  dentistry-lab2-postgres:
